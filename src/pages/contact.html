<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {

  /* Outer wrapper sizes itself to the scaled canvas height so no extra

  /* ===== Fixed-size canvas, exact Figma dimensions ===== */

        <form id="contact-form" novalidate>

</div>

<script>
  // ---- CONFIG ----
  const YOUR_EMAIL_HERE = "app.yardsailor@gmail.com"; // <-- replace with your real email

  // ---- Responsive scaling: keeps the 1440x875 canvas pixel-perfect at any viewport width ----
  const canvas = document.getElementById('canvas');
  const wrapper = document.getElementById('scale-wrapper');
  const BASE_W = 1440, BASE_H = 875;

  function scaleCanvas() {
    const scale = window.innerWidth / BASE_W;
    canvas.style.transform = `scale(${scale})`;
    wrapper.style.height = (BASE_H * scale) + 'px';
  }
  window.addEventListener('resize', scaleCanvas);
  scaleCanvas();

  // ---- Form logic ----
  const form = document.getElementById('contact-form');
  const sendBtn = document.getElementById('send-btn');
  const statusMsg = document.getElementById('status-msg');

  function setError(fieldId, show) {
    document.getElementById(fieldId).classList.toggle('error', show);
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function validate() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();

    let valid = true;

    setError('field-name', name.length === 0);
    if (name.length === 0) valid = false;

    setError('field-email', !isValidEmail(email));
    if (!isValidEmail(email)) valid = false;

    setError('field-subject', subject.length === 0);
    if (subject.length === 0) valid = false;

    setError('field-message', message.length === 0);
    if (message.length === 0) valid = false;

    return valid;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.className = 'status-msg';
    statusMsg.textContent = '';

    if (!validate()) return;

    const payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      subject: document.getElementById('subject').value.trim(),
      message: document.getElementById('message').value.trim(),
      _subject: `New Yard Sailor contact form message: ${document.getElementById('subject').value.trim()}`,
      _captcha: "false"
    };

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    try {
      const response = await fetch(`https://formsubmit.co/ajax/${YOUR_EMAIL_HERE}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("Request failed");

      statusMsg.className = 'status-msg success';
      statusMsg.textContent = "Message sent!";
      form.reset();
    } catch (err) {
      statusMsg.className = 'status-msg failure';
      statusMsg.textContent = "Something went wrong.";
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
    }
  });
</script>
